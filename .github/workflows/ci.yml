name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/FintechPlatform.Tests/FintechPlatform.Tests.csproj

      - name: Build
        run: dotnet build tests/FintechPlatform.Tests/FintechPlatform.Tests.csproj -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/FintechPlatform.Tests/FintechPlatform.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Static authorization/import checks
        run: |
          bash scripts/static-test-imports.sh
          bash scripts/static-test-transfer-authorization.sh

      - name: Public-readiness checks
        run: bash scripts/public-readiness-check.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: tests/FintechPlatform.Tests/TestResults/*.trx
          if-no-files-found: ignore
