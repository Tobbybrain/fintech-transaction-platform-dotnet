services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintech_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintech_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fintech_pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fintech_demo;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Webhooks__SigningSecret: ${WEBHOOK_SIGNING_SECRET:?Set WEBHOOK_SIGNING_SECRET in .env}
      DemoSeed__Enabled: "true"
      DemoSeed__Password: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    ports:
      - "8080:8080"

volumes:
  fintech_pgdata:
